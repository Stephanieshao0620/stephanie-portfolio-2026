<!doctype html>
<html lang="zh-Hant">

<body>
  <a class="skip-link" href="#case-content">跳至案例內容</a>

    <section class="case-hero section-shell">

        <p class="section-index" id="case-index"></p>

    <section class="case-meta section-shell" aria-label="專案資訊">

    <section class="case-story section-shell">
      <div class="case-story-heading">

        <h2 id="case-overview-title"></h2>
      </div>
      <div class="case-story-grid" id="case-story"></div>

    <section class="case-evidence section-shell">
      <div class="case-story-heading">
        <p class="section-index">SELECTED EVIDENCE</p>
        <h2>From design work to deliverable</h2>
      </div>
      <div class="case-gallery" id="case-gallery"></div>
